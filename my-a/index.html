```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>My AR Model</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #111;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
    }

    #ar-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);

      padding: 16px 28px;

      border: none;
      border-radius: 30px;

      background: white;
      color: black;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }
  </style>
</head>

<body>

<model-viewer
  id="model"
  src="./sample_triangle.glb"
  alt="3D Triangle"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  environment-image="neutral">

  <button id="ar-button" slot="ar-button">
    📷 View in Real World
  </button>

</model-viewer>

</body>
</html>
