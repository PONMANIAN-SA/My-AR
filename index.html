```html
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My AR Model</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #111;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
    }

    #ar-button {
      background: white;
      border: none;
      border-radius: 30px;
      padding: 16px 25px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<model-viewer
  src="./colorful_sports_car.glb"
  alt="My 3D Model"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate>

  <button id="ar-button" slot="ar-button">
    📷 View in AR
  </button>

</model-viewer>

</body>
</html>
