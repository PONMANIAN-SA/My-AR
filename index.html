```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My AR Model</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #111;
      overflow: hidden;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>

<model-viewer
  src="./sample_triangle.glb"
  alt="3D Triangle"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1">

  <button
    slot="ar-button"
    style="
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 25px;
      border: none;
      border-radius: 30px;
      background: white;
      color: black;
      font-size: 18px;
      font-weight: bold;
    ">
    📱 View in AR
  </button>

</model-viewer>

</body>
</html>
```
